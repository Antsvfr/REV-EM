  <rect x="8.6" y="12.6" width="2.8" height="7.8" rx="0.8" fill="#fff" opacity=".75"/>
  <rect x="13"  y="10"   width="2.8" height="10.4" rx="0.8" fill="#fff" opacity=".92"/>
  <rect x="17.4" y="7"   width="2.8" height="13.4" rx="0.8" fill="#fff"/>
</svg>
