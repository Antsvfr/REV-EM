<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <!-- Icône REV-EM : même glyphe que .brand-mark dans index.html (barres
       ascendantes), sur un aplat --accent plutôt que sur fond transparent —
